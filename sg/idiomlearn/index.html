            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

            font-size: 24px;
            margin-bottom: 20px;
            min-height: 30px;
            animation: fadeIn 0.3s ease-out;
        }

            {
                question: "形容人既勤劳又勇敢",
                answer: "勤劳勇敢",
                options: ["勤劳勇敢", "勤劳朴实", "勤劳节俭", "勤劳致富"]
            }
            // ... 这里还可以继续添加更多成语
        ];

        let currentQuestion = 0;
        let score = 0;
        let gameQuestions = [];
        const questionsPerGame = 10;

        const scoreElement = document.getElementById('score');
        const questionElement = document.getElementById('question');
        const optionsElement = document.getElementById('options');
        const feedbackElement = document.getElementById('feedback');
        const nextButton = document.getElementById('nextButton');
        const restartButton = document.getElementById('restartButton');
        const progressBar = document.getElementById('progress');
        const bgMusic = document.getElementById('bgMusic');
        const correctSound = document.getElementById('correctSound');
        const incorrectSound = document.getElementById('incorrectSound');
        const audioControl = document.getElementById('audioControl');

        let isMusicPlaying = false;

        audioControl.addEventListener('click', () => {
            if (isMusicPlaying) {
                bgMusic.pause();
                audioControl.textContent = '🔇';
            } else {
                bgMusic.play();
                audioControl.textContent = '🎵';
            }
            isMusicPlaying = !isMusicPlaying;
        });

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startNewGame() {
            currentQuestion = 0;
            score = 0;
            scoreElement.textContent = score;
            gameQuestions = shuffleArray([...allIdioms]).slice(0, questionsPerGame);
            restartButton.style.display = 'none';
            showQuestion();
        }

        function updateProgress() {
            const progress = ((currentQuestion + 1) / questionsPerGame) * 100;
            progressBar.style.width = `${progress}%`;
        }

        function showQuestion() {
            const idiom = gameQuestions[currentQuestion];
            questionElement.textContent = idiom.question;
            optionsElement.innerHTML = '';
            updateProgress();
            
            const shuffledOptions = shuffleArray([...idiom.options]);
            
            shuffledOptions.forEach(option => {
                const button = document.createElement('button');
                button.className = 'option';
                button.textContent = option;
                button.onclick = () => checkAnswer(option);
                optionsElement.appendChild(button);
            });

            feedbackElement.textContent = '';
            feedbackElement.className = 'feedback';
            nextButton.style.display = 'none';
        }

        function checkAnswer(selectedAnswer) {
            const correctAnswer = gameQuestions[currentQuestion].answer;
            const options = document.querySelectorAll('.option');
            options.forEach(option => option.disabled = true);

            if (selectedAnswer === correctAnswer) {
                score += 10;
                scoreElement.textContent = score;
                feedbackElement.textContent = '答对了！太棒了！';
                feedbackElement.className = 'feedback correct';
                correctSound.play();
            } else {
                feedbackElement.textContent = `答错了！正确答案是：${correctAnswer}`;
                feedbackElement.className = 'feedback incorrect';
                incorrectSound.play();
            }

            nextButton.style.display = 'inline-block';
        }

        nextButton.onclick = () => {
            currentQuestion++;
            if (currentQuestion < questionsPerGame) {
                showQuestion();
            } else {
                questionElement.textContent = `游戏结束！你的最终得分是：${score}分`;
                optionsElement.innerHTML = '';
                feedbackElement.textContent = score === 100 ? '太厉害了，满分！' : '继续加油哦！';
                nextButton.style.display = 'none';
                restartButton.style.display = 'inline-block';
                progressBar.style.width = '100%';
            }
        };

        restartButton.onclick = startNewGame;

        // 开始游戏
        startNewGame();
    </script>
</body>
</html>
