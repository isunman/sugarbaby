<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字矩阵雨</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            font-family: 'SimSun', '宋体', monospace; /* 使用更兼容的中文字体 */
        }
        
        .matrix-container {
            position: relative;
            width: 100%;
            height: 100vh;
        }
        
        .matrix-column {
            position: absolute;
            top: 0;
            color: #0F0; /* 简化的绿色代码 */
            font-size: 16px;
            text-shadow: 0 0 5px #0F0;
            opacity: 0.8;
            animation: fall linear infinite;
            /* 移除不兼容的writing-mode，改用传统方式实现竖向 */
            width: 16px; /* 固定列宽 */
            overflow: hidden;
        }
        
        @keyframes fall {
            from {
                top: -100%;
            }
            to {
                top: 100%;
            }
        }
        
        .matrix-char {
            display: block;
            height: 16px; /* 固定字符高度 */
            line-height: 16px; /* 确保垂直居中 */
            text-align: center; /* 水平居中 */
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="matrix-container" id="matrixContainer"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var container = document.getElementById('matrixContainer');
            var columns = Math.floor(window.innerWidth / 20);
            var chars = "01代码雨矩阵数字科技网络信息安全编程算法数据云计算人工智能机器学习深度学习区块链虚拟现实增强现实量子计算";
            
            // 预生成所有列
            for (var i = 0; i < columns; i++) {
                createColumn(i);
            }
            
            function createColumn(index) {
                var column = document.createElement('div');
                column.className = 'matrix-column';
                
                // 随机位置和动画参数
                var left = index * 20 + Math.random() * 10;
                column.style.left = left + 'px';
                
                var duration = 2 + Math.random() * 3;
                column.style.animationDuration = duration + 's';
                
                var delay = Math.random() * 5;
                column.style.animationDelay = '-' + delay + 's';
                
                // 创建字符
                var charCount = 30 + Math.floor(Math.random() * 20);
                for (var j = 0; j < charCount; j++) {
                    var char = document.createElement('div');
                    char.className = 'matrix-char';
                    char.textContent = chars.charAt(Math.floor(Math.random() * chars.length));
                    
                    // 随机高亮效果
                    if (Math.random() > 0.7) {
                        char.style.opacity = '1';
                        char.style.textShadow = '0 0 10px #0F0';
                        char.style.fontWeight = 'bold';
                    }
                    
                    column.appendChild(char);
                }
                
                container.appendChild(column);
                
                // 动画结束后重新创建列
                column.addEventListener('animationend', function() {
                    container.removeChild(column);
                    createColumn(index);
                }, false);
            }
            
            // 窗口大小改变时重置
            window.addEventListener('resize', function() {
                container.innerHTML = '';
                columns = Math.floor(window.innerWidth / 20);
                for (var i = 0; i < columns; i++) {
                    createColumn(i);
                }
            }, false);
        });
    </script>
</body>
</html>
